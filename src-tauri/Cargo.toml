[package]
name = "keyboard_dances_app"
version = "0.1.1"
edition = "2024"

[dependencies]
anyhow = "1.0"
directories = "6.0"
rfd = "0.17"
rodio = "0.22"
serde = { version = "1.0", features = ["derive"] }
symphonia = { version = "0.6", default-features = false, features = ["ogg", "vorbis", "wav", "pcm"] }
tauri = { version = "2.11.2", features = ["tray-icon"] }
toml = "1"

[target.'cfg(target_os = "linux")'.dependencies]
input = "0"
libc = "0"

[build-dependencies]
png = "0"
tauri-build = "2.6.2"
